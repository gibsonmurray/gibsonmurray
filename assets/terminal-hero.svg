<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Gibson Murray — creative developer</title>
  <desc id="desc">A colorful terminal window introducing Gibson Murray as a creative developer.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset=".45" stop-color="#24134f"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset=".48" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1000" height="300" rx="24" fill="url(#sky)"/>
  <circle cx="102" cy="78" r="90" fill="#ec4899" opacity=".16" filter="url(#blur)"/>
  <circle cx="862" cy="236" r="120" fill="#22d3ee" opacity=".15" filter="url(#blur)"/>

  <g fill="#fff" opacity=".7">
    <circle cx="86" cy="54" r="2"><animate attributeName="opacity" values=".25;1;.25" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="921" cy="72" r="2"><animate attributeName="opacity" values="1;.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="852" cy="38" r="1.5"><animate attributeName="opacity" values=".2;.9;.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="55" cy="242" r="1.5"><animate attributeName="opacity" values=".9;.2;.9" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="952" cy="220" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <g filter="url(#shadow)">
    <rect x="120" y="42" width="760" height="216" rx="15" fill="#090d18" stroke="#fff" stroke-opacity=".14"/>
    <path d="M120 82h760" stroke="#fff" stroke-opacity=".11"/>
    <circle cx="146" cy="62" r="6" fill="#fb7185"/>
    <circle cx="167" cy="62" r="6" fill="#fbbf24"/>
    <circle cx="188" cy="62" r="6" fill="#34d399"/>
    <text x="500" y="67" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle">gibson@github — portfolio</text>

    <text x="154" y="118" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">➜  ~ whoami</text>
    <text x="154" y="158" fill="url(#glow)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="36" font-weight="700">GIBSON MURRAY</text>
    <text x="154" y="190" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">creative developer · interface tinkerer · terminal artist</text>
    <text x="154" y="225" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">➜  ~</text>
    <rect x="211" y="212" width="10" height="17" rx="1" fill="#e2e8f0">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
